# Локальный запуск: web и воркер — отдельные сервисы из одного образа с общим volume для SQLite.
# (На Railway оба процесса запускаются в одном контейнере через start.sh — см. Dockerfile.)
services:
  web:
    build: .
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - db-data:/data
    stop_grace_period: 60s

volumes:
  db-data:
