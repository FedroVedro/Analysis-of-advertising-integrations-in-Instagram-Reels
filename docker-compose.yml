services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data

  # Тот же образ и тот же volume: файл SQLite общий для web и воркера
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - db-data:/data
    stop_grace_period: 60s

volumes:
  db-data:
